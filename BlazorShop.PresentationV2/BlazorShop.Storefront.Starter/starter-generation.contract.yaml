contractVersion: 1
starterVersion: 1.0.0-local
targetFramework: net10.0
generatedProject:
  namingConvention: BlazorShop.Storefront.{Name}
  outputRoot: BlazorShop.PresentationV2
  safeNamePattern: ^[A-Z][A-Za-z0-9]*$
packageDependencies:
  - id: BlazorShop.Storefront.Presentation
    versionProperty: StorefrontPresentationPackageVersion
  - id: BlazorShop.Storefront.Components
    versionProperty: StorefrontComponentsPackageVersion
allowedGeneratedZones:
  - Components/Layout
  - Components/Catalog
  - Components/Commerce
  - Components/Account
  - Components/States
  - Pages/Ssr
  - Pages/Hybrid
  - Pages/WasmHost
  - wwwroot/css
  - wwwroot/assets/generated
browserActionPolicy:
  owner: BlazorShop.Storefront.Presentation
  productPurchaseDescriptor: data-storefront-product-purchase
  addToCartDescriptor: data-storefront-command="cart.add-line"
  productPurchaseBaseline: Starter emits product purchase descriptors before generation; generators may only restyle or reposition them.
  generatedFunctionalJs: forbidden
  generatedVisualJsZone: wwwroot/js/visual
  generatedVisualJsStatus: disabled-until-allowed-zone-is-added
managedZones:
  - Features/feature-manifest.json
  - docs/storefront-analysis
protectedZones:
  - BlazorShop.Storefront.Presentation
  - StorefrontPackageVersions.props
  - starter-generation.contract.yaml
  - docs/storefront-analysis/generated-files.yaml
assetZones:
  - wwwroot/assets/generated
analysisArtifactZone: docs/storefront-analysis
featureManifest: Features/feature-manifest.json
hydrationModes:
  - InitialSnapshot
  - BrowserFetch
  - RefreshAfterHydration
requiredBffActions:
  - cart.add-line
  - cart.update-line
  - cart.remove-line
  - checkout.start
  - checkout.review
  - checkout.place-order
  - account.profile
  - account.password
  - account.address
  - account.order
  - auth.login
  - auth.logout
  - auth.register
  - auth.recovery
  - consent.save
  - consent.revoke
actionDescriptors:
  - id: product.selection-preview
    owner: BlazorShop.Storefront.Presentation
    descriptor: data-selection-preview-route
    routeSource: ProductPurchaseActionDescriptor.SelectionPreviewRoute
  - id: cart.add-line
    owner: BlazorShop.Storefront.Presentation
    descriptor: data-storefront-command="cart.add-line"
    routeSource: StorefrontCartActionDescriptor.CurrentCartRoute
  - id: cart.update-line
    owner: BlazorShop.Storefront.Presentation
    routeSource: StorefrontCartActionDescriptor.UpdateLineRouteTemplate
  - id: cart.remove-line
    owner: BlazorShop.Storefront.Presentation
    routeSource: StorefrontCartActionDescriptor.RemoveLineRouteTemplate
  - id: checkout.start
    owner: BlazorShop.Storefront.Presentation
    routeSource: StorefrontCheckoutActionDescriptor.CurrentCheckoutRoute
  - id: checkout.review
    owner: BlazorShop.Storefront.Presentation
    routeSource: StorefrontCheckoutActionDescriptor.ReviewRoute
  - id: checkout.place-order
    owner: BlazorShop.Storefront.Presentation
    routeSource: StorefrontCheckoutActionDescriptor.PlaceOrderRoute
  - id: account.profile
    owner: BlazorShop.Storefront.Presentation
    routeSource: StorefrontAccountProfileActionDescriptor.SaveProfileRoute
  - id: account.password
    owner: BlazorShop.Storefront.Presentation
    routeSource: StorefrontAccountPasswordActionDescriptor.ChangePasswordRoute
  - id: account.address
    owner: BlazorShop.Storefront.Presentation
    routeSource: StorefrontAccountAddressActionDescriptor.CurrentAddressesRoute
  - id: account.order
    owner: BlazorShop.Storefront.Presentation
    routeSource: StorefrontAccountOrderActionDescriptor.OrderListRouteTemplate
  - id: auth.login
    owner: BlazorShop.Storefront.Presentation
    route: /signin
  - id: auth.logout
    owner: BlazorShop.Storefront.Presentation
    route: /logout
  - id: auth.register
    owner: BlazorShop.Storefront.Presentation
    route: /register
  - id: auth.recovery
    owner: BlazorShop.Storefront.Presentation
    route: /forgot-password
  - id: consent.save
    owner: BlazorShop.Storefront.Presentation
    descriptor: data-storefront-consent-accept-url
    routeSource: StorefrontConsentActionContext.AcceptUrl
  - id: consent.revoke
    owner: BlazorShop.Storefront.Presentation
    descriptor: data-storefront-consent-revoke-url
    routeSource: StorefrontConsentActionContext.RevokeUrl
buildCommands:
  - dotnet restore BlazorShop.PresentationV2/BlazorShop.Storefront.{Name}/BlazorShop.Storefront.{Name}.csproj
  - dotnet build BlazorShop.PresentationV2/BlazorShop.Storefront.{Name}/BlazorShop.Storefront.{Name}.csproj --no-restore
gateCommands:
  - ./scripts/qa/run-storefront-starter-isolation-gate.ps1
  - ./scripts/qa/run-storefront-sample-release-gate.ps1
generatedConstraints:
  routeDeclarations: forbidden
  additionalRouteAssemblies: forbidden
metadata:
  starterContractVersion: contractVersion
  packageVersionSource: StorefrontPackageVersions.props
  packageReferences:
    - BlazorShop.Storefront.Presentation
    - BlazorShop.Storefront.Components
slots:
  - id: layout.header
    owner: generated
    path: Components/Layout/MainLayout.razor
  - id: layout.footer
    owner: generated
    path: Components/Layout/MainLayout.razor
  - id: layout.main-navigation
    owner: generated
    path: Components/Layout/MainLayout.razor
  - id: layout.mobile-navigation
    owner: generated
    path: Components/Layout/MainLayout.razor
  - id: layout.cart-badge
    owner: generated
    path: Components/Layout/MainLayout.razor
  - id: layout.account-menu
    owner: generated
    path: Components/Layout/MainLayout.razor
  - id: home.sections
    owner: generated
    path: Pages/Ssr/Home/HomePage.razor
  - id: catalog.product-card
    owner: generated
    path: Components/Catalog/ProductSummaryCard.razor
  - id: catalog.filters
    owner: generated
    path: Pages/Hybrid/Catalog/CategoryPage.razor
  - id: catalog.sorting
    owner: generated
    path: Pages/Hybrid/Catalog/CategoryPage.razor
  - id: catalog.pagination
    owner: generated
    path: Pages/Hybrid/Catalog/CategoryPage.razor
  - id: product.gallery
    owner: generated
    path: Components/Catalog/ProductGalleryPlaceholder.razor
  - id: product.information
    owner: generated
    path: Components/Catalog/ProductDetailShell.razor
  - id: product.purchase
    owner: generated
    path: Components/Catalog/PurchasePanelPlaceholder.razor
    action: cart.add-line
  - id: cart.page
    owner: managed
    path: Pages/Hybrid/Commerce/CartPage.razor
  - id: checkout.page
    owner: managed
    path: Pages/Hybrid/Commerce/CheckoutPage.razor
  - id: account.shell
    owner: managed
    path: Pages/WasmHost/Account/AccountHostPage.razor
  - id: system.error
    owner: managed
    path: Components/States/ErrorState.razor
routes:
  - route: /
    path: Pages/Ssr/Home/HomePage.razor
    renderOwner: SSR
    hydrationMode: InitialSnapshot
  - route: /pages/{Slug}
    path: Pages/Ssr/Content/ContentPage.razor
    renderOwner: SSR
    hydrationMode: InitialSnapshot
  - route: /signin
    path: Pages/Ssr/Auth/AuthShellPage.razor
    renderOwner: SSR
    hydrationMode: InitialSnapshot
  - route: /register
    path: Pages/Ssr/Auth/AuthShellPage.razor
    renderOwner: SSR
    hydrationMode: InitialSnapshot
  - route: /forgot-password
    path: Pages/Ssr/Auth/AuthShellPage.razor
    renderOwner: SSR
    hydrationMode: InitialSnapshot
  - route: /reset-password
    path: Pages/Ssr/Auth/AuthShellPage.razor
    renderOwner: SSR
    hydrationMode: InitialSnapshot
  - route: /maintenance
    path: Pages/Ssr/System/MaintenancePage.razor
    renderOwner: SSR
    hydrationMode: InitialSnapshot
  - route: /{*Path:nonfile}
    path: Pages/Ssr/System/NotFoundPage.razor
    renderOwner: SSR
    hydrationMode: InitialSnapshot
  - route: /category/{Slug}
    path: Pages/Hybrid/Catalog/CategoryPage.razor
    renderOwner: Hybrid
    hydrationMode: InitialSnapshot
  - route: /product/{Slug}
    path: Pages/Hybrid/Catalog/ProductPage.razor
    renderOwner: Hybrid
    hydrationMode: InitialSnapshot
  - route: /search
    path: Pages/Hybrid/Catalog/SearchPage.razor
    renderOwner: Hybrid
    hydrationMode: BrowserFetch
  - route: /cart
    path: Pages/Hybrid/Commerce/CartPage.razor
    renderOwner: Hybrid
    hydrationMode: BrowserFetch
  - route: /my-cart
    path: Pages/Hybrid/Commerce/CartPage.razor
    renderOwner: Hybrid
    hydrationMode: BrowserFetch
  - route: /checkout
    path: Pages/Hybrid/Commerce/CheckoutPage.razor
    renderOwner: Hybrid
    hydrationMode: BrowserFetch
  - route: /payment/result
    path: Pages/Hybrid/Commerce/PaymentResultPage.razor
    renderOwner: Hybrid
    hydrationMode: RefreshAfterHydration
  - route: /payment-success
    path: Pages/Hybrid/Commerce/PaymentResultPage.razor
    renderOwner: Hybrid
    hydrationMode: RefreshAfterHydration
  - route: /payment-cancel
    path: Pages/Hybrid/Commerce/PaymentResultPage.razor
    renderOwner: Hybrid
    hydrationMode: RefreshAfterHydration
  - route: /todays-deals
    path: Pages/Hybrid/Commerce/DealsPage.razor
    renderOwner: Hybrid
    hydrationMode: BrowserFetch
  - route: /new-releases
    path: Pages/Hybrid/Catalog/NewReleasesPage.razor
    renderOwner: Hybrid
    hydrationMode: BrowserFetch
  - route: /account
    path: Pages/WasmHost/Account/AccountHostPage.razor
    renderOwner: WASM-host
    hydrationMode: BrowserFetch
