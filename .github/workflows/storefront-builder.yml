name: StorefrontBuilder

on:
  pull_request:
    paths:
      - "tools/BlazorShop.AI.StorefrontBuilder/**"
      - "BlazorShop.PresentationV2/BlazorShop.Storefront.BuilderDemo/**"
      - "BlazorShop.PresentationV2/BlazorShop.Storefront.Presentation/**"
      - "BlazorShop.PresentationV2/BlazorShop.Storefront.Runtime/**"
      - "BlazorShop.PresentationV2/BlazorShop.Storefront.Client/**"
      - "BlazorShop.PresentationV2/BlazorShop.Storefront.Components/**"
      - "BlazorShop.PresentationV2/BlazorShop.Storefront.Starter/**"
      - "scripts/qa/run-storefront-builder-*.ps1"
      - "docs/visual-reverse-engineering-skill/**"
      - "docs/architecture/11-storefront-builder.md"
      - "docs/agents/storefront-builder.md"
      - "docs/refactor-control-Commerce-storefront/**Storefront*Builder*.md"
      - "BlazorShop.Tests.V2/**"
  workflow_dispatch:
    inputs:
      run_browser_gates:
        description: "Run Playwright visual QA and commerce regression smoke"
        required: false
        default: "false"
  schedule:
    - cron: "17 3 * * 1"

jobs:
  fast-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: tools/BlazorShop.AI.StorefrontBuilder/package-lock.json
      - name: Install StorefrontBuilder node dependencies
        working-directory: tools/BlazorShop.AI.StorefrontBuilder
        run: npm ci
      - name: Schema tests
        run: ./tools/BlazorShop.AI.StorefrontBuilder/scripts/validate/Test-StorefrontBuilderSchemas.ps1
      - name: Preflight tests
        run: ./tools/BlazorShop.AI.StorefrontBuilder/scripts/validate/Test-StorefrontBuilderPreflight.ps1 -ReferenceUrls https://example.com -Name Demo -StoreKey sample -Mode validate-only
      - name: Protected file guard tests
        run: ./tools/BlazorShop.AI.StorefrontBuilder/scripts/validate/Test-StorefrontBuilderGuard.ps1 -ProjectRoot BlazorShop.PresentationV2/BlazorShop.Storefront.BuilderDemo
      - name: Generation fixture tests
        run: dotnet test BlazorShop.Tests.V2/BlazorShop.Tests.V2.csproj --filter "FullyQualifiedName~StorefrontBuilder"
      - name: Idempotency tests
        run: ./tools/BlazorShop.AI.StorefrontBuilder/scripts/validate/Test-StorefrontBuilderIdempotency.ps1 -ProjectRoot BlazorShop.PresentationV2/BlazorShop.Storefront.BuilderDemo
      - name: Regeneration ownership gate
        shell: pwsh
        run: ./scripts/qa/run-storefront-builder-regeneration-gate.ps1
      - name: Isolation gate describe mode
        shell: pwsh
        run: ./scripts/qa/run-storefront-builder-isolation-gate.ps1 -Describe
      - name: Generated proof structure gate
        shell: pwsh
        run: ./scripts/qa/run-storefront-builder-generated-proof.ps1 -ProofLevel Structure
      - name: Generated proof fast foundation functional browser gate
        shell: pwsh
        run: ./scripts/qa/run-storefront-builder-generated-proof.ps1 -ProofLevel FoundationFunctionalFast
      - name: Full proof fixture wrapper describe mode
        shell: pwsh
        run: ./scripts/qa/run-storefront-builder-full-proof-with-fixture.ps1 -Describe

  full-fixture-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.run_browser_gates == 'true' || github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: tools/BlazorShop.AI.StorefrontBuilder/package-lock.json
      - name: Install StorefrontBuilder node dependencies
        working-directory: tools/BlazorShop.AI.StorefrontBuilder
        run: npm ci
      - name: Verify Docker prerequisites
        shell: pwsh
        run: |
          docker version
          docker compose version
      - name: Run self-contained full fixture proof
        shell: pwsh
        run: ./scripts/qa/run-storefront-builder-full-proof-with-fixture.ps1
      - name: Print fixture runtime logs on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path .gstack/run-v2-local) {
            Get-ChildItem .gstack/run-v2-local -File | ForEach-Object {
              Write-Host "== $($_.Name) =="
              Get-Content -LiteralPath $_.FullName -Tail 200
            }
          }
          if (Test-Path artifacts/storefront-builder/generated/BlazorShop.Storefront.GeneratedProof/docs/storefront-analysis/full-proof-with-fixture-report.md) {
            Write-Host "== full-proof-with-fixture-report.md =="
            Get-Content artifacts/storefront-builder/generated/BlazorShop.Storefront.GeneratedProof/docs/storefront-analysis/full-proof-with-fixture-report.md
          }
      - name: Stop fixture runtime
        if: always()
        shell: pwsh
        run: ./scripts/stop-v2-local.ps1 -StopDocker
      - name: Upload full proof reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-builder-full-proof-reports
          if-no-files-found: warn
          path: |
            .gstack/run-v2-local/**
            artifacts/storefront-builder/generated/BlazorShop.Storefront.GeneratedProof/docs/storefront-analysis/**
            artifacts/storefront-builder/generated/BlazorShop.Storefront.GeneratedProof/playwright-report/**
            artifacts/storefront-builder/generated/BlazorShop.Storefront.GeneratedProof/test-results/**

  expensive-live-capture:
    if: github.event_name == 'workflow_dispatch' && inputs.run_browser_gates == 'true' || github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full external reference-site capture
        run: echo "Manual/nightly only: full external reference-site capture"
      - name: Full visual diff against live target
        run: echo "Manual/nightly only: full visual diff against live target"
      - name: Full payment/order browser regression
        run: echo "Manual/nightly only: full payment/order browser regression"
